[project]
name = "mcp-trace-studio-backend"
version = "0.1.0"
description = "FastAPI backend for MCP Trace Studio"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.21",
    "pydantic-settings>=2.6",
    "mcp>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
    "httpx>=0.28",
    "anyio[trio]>=4.6",
    "pytest-anyio>=0.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
